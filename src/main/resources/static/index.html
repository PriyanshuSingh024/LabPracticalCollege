<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; padding: 40px 16px; }
    .container { max-width: 380px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 14px #00000014; }
    h2 { text-align: center; color: #1f2937; }
    label { display: block; margin-top: 12px; }
    input, select, button { width: 100%; box-sizing: border-box; padding: 11px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 5px; }
    button { margin-top: 20px; background: #2563eb; color: white; border: 0; cursor: pointer; }
    #message { color: green; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Registration Form</h2>
    <form id="registrationForm">
      <label for="studentName">Student Name</label>
      <input id="studentName" name="studentName" type="text" placeholder="Enter Student Name" required>
      <label for="rollNumber">Roll Number</label>
      <input id="rollNumber" name="rollNumber" type="text" placeholder="Enter Roll Number" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Enter Email" required>
      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option>B.Tech</option><option>BCA</option><option>MCA</option><option>MBA</option>
      </select>
      <button type="submit">Submit</button>
    </form>
    <p id="message"></p>
  </div>
  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent = "Registration form submitted successfully!";
    });
  </script>
</body>
</html>
